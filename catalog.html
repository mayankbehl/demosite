<script src="https://assets.adobedtm.com/666644a00be2/4265a29eb55a/launch-3e5828650784-development.min.js" async></script>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var id = params.get('id') || 'RN-001';
  var item = (window.READING_NOOK_CATALOG || []).find(function(x){return x.id === id;}) || window.READING_NOOK_CATALOG[0];
  window.readingNookCurrentBook = item;
  document.title = item.name + ' | The Reading Nook';
  var root=document.getElementById('book-detail');
  var left=document.createElement('div');left.className='recs-detail__cover';left.style.background=item.background;left.style.color=item.color;left.textContent=item.name;
  var right=document.createElement('div');
  var genre=document.createElement('p');genre.className='recs-detail__genre';genre.textContent=item.category;
  var title=document.createElement('h1');title.className='recs-detail__title';title.textContent=item.name;
  var desc=document.createElement('p');desc.textContent=item.message;
  var price=document.createElement('p');price.className='recs-detail__price';price.textContent='$'+item.value.toFixed(2)+' (demo)';
  var link=document.createElement('a');link.className='recs-detail__btn';link.href='catalog.html';link.textContent='Back to catalog';
  right.append(genre,title,desc,price,link);root.innerHTML='';var wrap=document.createElement('div');wrap.className='recs-detail__grid';wrap.append(left,right);root.append(wrap);
  // Explicit item-view event for catalog signals; existing Tags page-load rule remains in place.
  // Recs parameters belong under data.__adobe.target, not the top level of data.
  function sendProductView(){
     if(typeof window.alloy !== 'function'){ return; }
     window.alloy('sendEvent',{
       // Ask Target for a named decision so it receives these entity attributes.
       personalization:{decisionScopes:['reading-nook-product-view']},
       xdm:{eventType:'commerce.productViews',commerce:{productViews:{value:1}},web:{webPageDetails:{URL:location.href,name:item.name}}},
       data:{__adobe:{target:{'entity.id':item.id,'entity.name':item.name,'entity.categoryId':item.category,'entity.pageUrl':item.pageUrl,'entity.thumbnailUrl':item.thumbnailUrl,'entity.message':item.message,'entity.value':String(item.value),'entity.inventory':'10'}}},
       renderDecisions:false
     }).catch(function(err){console.warn('Recommendations product-view event failed',err);});
  }
  // Adobe Tags library is loaded asynchronously. Wait until alloy is defined without altering Tags.
  var tries=0;var poll=setInterval(function(){tries++;if(typeof window.alloy==='function'){clearInterval(poll);sendProductView();}else if(tries>=30){clearInterval(poll);}},250);
}());
     </script>
